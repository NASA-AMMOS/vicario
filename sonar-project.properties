# SonarQube Cloud configuration for vicario
#
# Set up per the AMMOS scanning guide ("Code Vulnerability Scanning Set Up for
# AMMOS Open Source Software"), the same way as the tig repo. The scan runs in
# .github/workflows/security-scan.yml; Automatic Analysis must be turned off for
# the project in SonarQube Cloud (Administration -> Analysis Method).
sonar.projectKey=NASA-AMMOS_vicario
sonar.organization=nasa-ammos

# Project metadata. projectVersion is overridden from pom.xml (<semver>) by the
# Security-Scan workflow.
sonar.projectName=vicario
sonar.projectVersion=2.7.2
sonar.projectDescription=Java image I/O and format translation (jConvertIIO) for planetary science data: VICAR, PDS3, PDS4, ISIS and FITS.

# Project links - shown in the SonarQube Cloud UI
sonar.links.homepage=https://nasa-ammos.github.io/vicario/
sonar.links.scm=https://github.com/NASA-AMMOS/vicario
sonar.links.issue=https://github.com/NASA-AMMOS/vicario/issues
sonar.links.ci=https://github.com/NASA-AMMOS/vicario/actions

# ==========================================
# Analysis scope
# ==========================================
# Sources and tests are listed explicitly so the roots cannot overlap.
#
#   src/main/java       the library and jConvertIIO -- the bulk of the code
#   src/main/scripts    Python label and mesh helper scripts
#   src/main/resources  XSL stylesheets and label templates; indexed so secret
#                       detection and the XML rules see them
sonar.sources=\
  src/main/java,\
  src/main/scripts,\
  src/main/resources

# The JUnit suite and the Playwright feature tests (docs/TESTING.md).
sonar.tests=\
  src/test/java,\
  tests/e2e

# Compiled classes and dependency jars from the workflow's Maven build. Java
# analysis without them misses most type-aware and security rules.
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar
sonar.java.test.libraries=target/dependency/*.jar
sonar.java.source=8

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.jar,\
  **/*.class

sonar.test.exclusions=\
  tests/e2e/node_modules/**,\
  tests/e2e/.cache/**,\
  tests/e2e/report/**,\
  tests/e2e/test-results/**,\
  tests/e2e/results/**,\
  tests/e2e/site/**,\
  tests/e2e/package-lock.json

# Coverage measured by JaCoCo (the `coverage` profile in pom.xml) in the
# Security-Scan workflow: the JUnit suite plus the Playwright feature tests,
# whose jConvertIIO processes run with the JaCoCo agent. Merged into one report.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Language settings
sonar.python.version=3.9,3.10,3.11,3.12,3.13
sonar.sourceEncoding=UTF-8

sonar.tags=planetary,nasa,vicar,pds,java,image-io

# sonar.sarifReportPaths is supplied by the Security-Scan workflow, which
# passes the repaired CodeQL reports on the scanner command line.
