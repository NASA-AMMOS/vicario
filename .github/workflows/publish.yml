name: Publish site and test report

# Full-tier feature tests on main, published with the project home page to
# GitHub Pages (Settings > Pages > Source: GitHub Actions). The site is
# deployed whether or not tests fail, so it always shows the latest result.
# Pull requests are tested by ci.yml and do not publish.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  e2e-full:
    name: e2e-full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      site: ${{ steps.site.outcome }}
    defaults:
      run:
        working-directory: tests/e2e
    env:
      VICARIO_PYTHON: python
      JAVA_VERSION_LABEL: temurin-17
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Set up Python (label scripts)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lxml
        run: python -m pip install lxml==6.1.3

      - name: Build FAT jar and test classes
        working-directory: .
        # runs the unit tests too, so the report includes them
        run: mvn -B -P shade -Dmaven.test.failure.ignore=true package test-compile

      - name: Install test dependencies
        run: npm ci

      - name: Restore test data
        id: data-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/e2e/.cache/data
          key: testdata-full-${{ hashFiles('tests/e2e/data/manifest.json') }}

      - name: Fetch and verify public test data
        run: node scripts/fetch-test-data.mjs --tier full

      - name: Feature tests (full tier)
        id: tests
        run: npx playwright test --project full

      - name: Feature summary
        if: ${{ !cancelled() }}
        run: cat report/overview.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save test data
        if: success() && steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tests/e2e/.cache/data
          key: testdata-full-${{ hashFiles('tests/e2e/data/manifest.json') }}

      - name: Upload report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: feature-report-full
          path: |
            tests/e2e/report/
            tests/e2e/results/
          retention-days: 5
          if-no-files-found: warn

      # only publish a run that produced a report (tests ran, pass or fail)
      - name: Build site
        id: site
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: node scripts/build-site.mjs --out site

      - name: Upload Pages artifact
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: tests/e2e/site

  deploy:
    name: deploy
    needs: e2e-full
    if: ${{ !cancelled() && needs.e2e-full.outputs.site == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
