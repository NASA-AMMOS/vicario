name: CI

# PR gate. The jobs below are the required status checks for main and develop
# (see docs/TESTING.md, "Branch protection"). Pushes run this workflow through
# release.yml, which calls it before building.
on:
  pull_request:
    branches:
      - main
      - develop
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  junit:
    name: junit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Unit tests
        run: mvn -B test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 5
          if-no-files-found: warn

  e2e-fast:
    name: e2e-fast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    env:
      VICARIO_PYTHON: python
      JAVA_VERSION_LABEL: temurin-17
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Set up Python (label scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lxml
        run: python -m pip install lxml==6.1.3

      - name: Build FAT jar and test classes
        working-directory: .
        # tests themselves run in the junit job
        run: mvn -B -P shade -DskipTests package test-compile

      - name: Install test dependencies
        run: npm ci

      - name: Restore test data
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: tests/e2e/.cache/data
          key: testdata-fast-${{ hashFiles('tests/e2e/data/manifest.json') }}

      - name: Fetch and verify public test data
        run: node scripts/fetch-test-data.mjs --tier fast

      - name: Feature tests (fast tier)
        run: npx playwright test --project fast

      - name: Feature summary
        if: always()
        run: node scripts/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # save only after a green run, so a bad download never occupies the key
      - name: Save test data
        if: success() && steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/e2e/.cache/data
          key: testdata-fast-${{ hashFiles('tests/e2e/data/manifest.json') }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fast
          path: |
            tests/e2e/playwright-report/
            tests/e2e/results/
          retention-days: 5
          if-no-files-found: warn

  data-guard:
    name: data-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: No internal paths or unpinned data
        run: bash tests/e2e/scripts/check-data-sensitivity.sh
