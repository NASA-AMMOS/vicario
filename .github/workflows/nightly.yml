name: Nightly feature tests

# Full tier: every feature test, including the full-size public products.
# Not a required check; failures are triaged from the report.
on:
  schedule:
    - cron: '0 7 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    name: e2e-full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tests/e2e
    env:
      VICARIO_PYTHON: python
      JAVA_VERSION_LABEL: temurin-17
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Set up Python (label scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lxml
        run: python -m pip install lxml==6.1.3

      - name: Build FAT jar and test classes
        working-directory: .
        run: mvn -B -P shade -DskipTests package test-compile

      - name: Install test dependencies
        run: npm ci

      - name: Restore test data
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: tests/e2e/.cache/data
          key: testdata-full-${{ hashFiles('tests/e2e/data/manifest.json') }}

      - name: Fetch and verify public test data
        run: node scripts/fetch-test-data.mjs --tier full

      - name: Feature tests (full tier)
        run: npx playwright test --project full

      - name: Feature summary
        if: always()
        run: node scripts/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Save test data
        if: success() && steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/e2e/.cache/data
          key: testdata-full-${{ hashFiles('tests/e2e/data/manifest.json') }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            tests/e2e/playwright-report/
            tests/e2e/results/
          retention-days: 5
          if-no-files-found: warn
