name: "CodeQL Security Scan Configuration"

# Keep the default query suite and add the extended security queries.
disable-default-queries: false

queries:
  - uses: security-extended

# Scope note: vicario is a Java library and CLI (src/main/java) plus helper
# Python scripts (src/main/scripts). Three CodeQL languages are analyzed,
# declared in security-scan.yml:
#
#   java-kotlin - src/main/java, compiled by the traced Maven build
#   python      - src/main/scripts (label and mesh helper scripts)
#   actions     - this repo's own GitHub Actions workflows
paths-ignore:
  # Not code we wrote, or not code at all.
  - 'docs/**'
  - 'webdocs/**'
  - '**/*.md'

  # Build output, dependencies and test data.
  - 'target/**'
  - '**/*.jar'
  - '**/__pycache__/**'
  - '**/*.pyc'
  - '**/node_modules/**'
  - 'tests/e2e/.cache/**'

  # Tests. The JUnit suite and the Playwright feature tests are declared to
  # SonarQube as tests (see sonar-project.properties) but are not useful
  # CodeQL targets.
  - 'src/test/**'
  - 'tests/**'

query-filters:
  # Style and maintainability suggestions add volume without adding security
  # signal; SonarQube already covers that ground.
  - exclude:
      problem.severity: recommendation
